[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-callbacks-promptfirewall"
version = "0.1.0"
description = "Sub-millisecond PII detection and prompt injection firewall for LlamaIndex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Timur Rakhmatullin", email = "timur.rakhmatullin86@gmail.com" },
]
keywords = [
    "llamaindex",
    "llama-index",
    "promptfirewall",
    "pii",
    "injection",
    "security",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "llama-index-core>=0.12.0",
    "promptfirewall-rs>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/TimurRakhmatullin86/llama-index-callbacks-promptfirewall"
Repository = "https://github.com/TimurRakhmatullin86/llama-index-callbacks-promptfirewall"
Issues = "https://github.com/TimurRakhmatullin86/llama-index-callbacks-promptfirewall/issues"
"promptfirewall" = "https://github.com/TimurRakhmatullin86/promptfirewall"

[tool.hatch.envs.test]
dependencies = ["pytest"]

[tool.hatch.envs.test.scripts]
test = "pytest tests/ -v"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
